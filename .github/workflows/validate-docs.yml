name: Validate documentation

on:
  push:
  pull_request:

jobs:
  askme-structure:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Validate AskMe structure
        run: python3 scripts/check-askme-structure.py
      - name: Test AskMe structure validator
        run: python3 scripts/test-check-askme-structure.py
